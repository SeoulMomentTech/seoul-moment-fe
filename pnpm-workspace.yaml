packages:
  - apps/*
  - packages/*

# 단일 앱 전용 의존성(next, axios, swiper 등)은 해당 package.json에 그대로 둔다.
# 실험이 여러 패키지에 걸칠 때만 `beta` 카탈로그를 추가
catalogs:
  stable:
    # --- TypeScript (TS 6/7 이중 구성: 루트 CLAUDE.md 참고) ---
    typescript: npm:@typescript/typescript6@~6.0.2
    "@typescript/native": npm:typescript@~7.0.2

    # --- Lint ---
    eslint: ^9.36.0
    "@eslint/js": ^9.36.0
    typescript-eslint: ^8.66.0
    eslint-plugin-react-hooks: ^5.2.0
    eslint-plugin-react-refresh: ^0.4.22
    globals: ^16.4.0

    # --- Build / Test ---
    vite: ^7.1.7
    "@vitejs/plugin-react": ^5.1.0
    vitest: ^4.0.18
    "@playwright/test": ^1.58.0
    # tailwindcss 본체와 @tailwindcss/* 어댑터는 같은 릴리스 트레인이다.
    # cli(ui 전용) / vite(admin 전용)는 단일 사용이지만, 빠지면 각자 최신 4.x로
    # 해석돼 엔진이 여러 벌 깔린다. 네 개를 한 값으로 묶어 정확히 고정한다.
    # 4.1.18 -> 4.3.3: web/admin/ui 빌드 CSS를 셀렉터 단위로 대조해 검증했다.
    # 실제 차이는 :-moz-focusring 범위 축소(업스트림 수정) 한 건뿐이고
    # 나머지는 공백/상수 폴딩/oklch hue 표기(0 -> none)로 렌더링이 동일하다.
    tailwindcss: 4.3.3
    "@tailwindcss/postcss": 4.3.3
    "@tailwindcss/cli": 4.3.3
    "@tailwindcss/vite": 4.3.3
    tailwindcss-animated: ^2.0.0

    # --- React ---
    react: 19.2.7
    react-dom: 19.2.7
    "@types/react": 19.2.17
    "@types/react-dom": 19.2.3
    "@types/node": ^24.10.0

    # --- Radix ---
    "@radix-ui/react-accordion": ^1.2.12
    "@radix-ui/react-dialog": ^1.1.15
    "@radix-ui/react-dropdown-menu": ^2.1.16
    "@radix-ui/react-label": ^2.1.7
    "@radix-ui/react-select": ^2.2.6
    "@radix-ui/react-slot": ^1.2.3
    "@radix-ui/react-tabs": ^1.1.13

    # --- Runtime ---
    react-hook-form: ^7.69.0
    "@hookform/resolvers": ^5.2.2
    "@tanstack/react-query": ^5.90.6
    zod: 4.0.5
    zustand: ^5.0.8
    es-toolkit: ^1.41.0
    clsx: ^2.1.1
    tailwind-merge: ^3.3.1
    lucide-react: ^0.511.0
    sonner: ^2.0.7
    react-error-boundary: ^6.0.0
