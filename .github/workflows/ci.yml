name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `tsc` resolves to TypeScript 7 (@typescript/native alias); ESLint keeps
      # using the TypeScript 6 API via the `typescript` -> @typescript/typescript6 alias.
      # See .claude/CLAUDE.md "TypeScript 6/7 Dual Setup".
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
